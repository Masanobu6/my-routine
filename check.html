<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>インストール診断</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f5f4f1;--card:#fff;--text:#1c1c1e;--muted:#8a8a8e;--line:#e6e4de;
      --accent:#e0672f;--ok:#2e7d3a;--ng:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--text:#f2f2f0;
  --muted:#8e8e93;--line:#2d2d31;--accent:#f08050;--ok:#5cc46e;--ng:#ff7a6b}}
body{margin:0;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:18px}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.mark{font-size:20px;font-weight:800;line-height:1.3;flex:none;width:24px;text-align:center}
.ok{color:var(--ok)} .ng{color:var(--ng)} .wait{color:var(--muted)}
.k{font-weight:700;font-size:15px}
.v{font-size:13px;color:var(--muted);word-break:break-all;white-space:pre-wrap}
button{width:100%;padding:15px;border:none;border-radius:12px;background:var(--accent);
  color:#fff;font-size:16px;font-weight:700;margin-top:14px;font-family:inherit}
button.sub2{background:var(--card);color:var(--text);border:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
<h1>インストール診断</h1>
<div class="sub">このページを、アプリを入れたいスマホの Chrome で開いてください。</div>
<div id="list"></div>
<button id="install" style="display:none">ここからインストールする</button>
<button class="sub2" id="copy">結果をコピーする</button>
<div class="note">「コピーする」を押して、チャットに貼りつけてもらえれば原因が分かります。</div>
</div>
<script>
let prompted = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  prompted = e;
  add('beforeinstallprompt', true, 'Chrome が「入れられる」と判断しました');
  document.getElementById('install').style.display = 'block';
});
window.addEventListener('appinstalled', () => add('appinstalled', true, 'インストールされました'));

const rows = [];
function add(k, state, v){
  rows.push({k, state, v});
  draw();
}
function draw(){
  document.getElementById('list').innerHTML = rows.map(r =>
    '<div class="item"><div class="mark ' + (r.state === true ? 'ok' : r.state === false ? 'ng' : 'wait') + '">' +
    (r.state === true ? '○' : r.state === false ? '×' : '…') + '</div>' +
    '<div><div class="k">' + r.k + '</div><div class="v">' + r.v + '</div></div></div>').join('');
}

(async () => {
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isChrome = /Chrome\/(\d+)/.test(ua) && !/EdgA|OPR|SamsungBrowser|FxiOS|YJApp|Line|FBAN/i.test(ua);
  const other = ua.match(/EdgA|OPR|SamsungBrowser|FxiOS|Firefox|YJApp|Line|FBAN|FBAV/i);

  add('ブラウザ', isChrome ? true : false,
      (isAndroid ? 'Android' : 'Androidではない') + ' / ' +
      (isChrome ? 'Chrome' : other ? ('Chromeではない（' + other[0] + '）' ) : '判別できず') +
      '\n' + ua);

  const standalone = window.matchMedia('(display-mode: standalone)').matches ||
                     window.navigator.standalone === true;
  add('いまの開き方', !standalone, standalone
      ? 'すでにアプリとして開いています（インストール済み。メニューには「アプリを開く」が出ます）'
      : 'ブラウザのタブで開いています');

  add('HTTPS', window.isSecureContext, location.origin);

  // マニフェスト
  try {
    const link = document.querySelector('link[rel=manifest]');
    const url = new URL('manifest.webmanifest', location.href).href;
    const res = await fetch(url);
    const ct = res.headers.get('content-type') || '(なし)';
    const m = await res.json();
    const sizes = (m.icons || []).map(i => i.sizes + (i.purpose ? '/' + i.purpose : '')).join(' ');
    const has192 = (m.icons || []).some(i => (i.sizes || '').includes('192'));
    const has512 = (m.icons || []).some(i => (i.sizes || '').includes('512'));
    const okDisp = ['standalone','fullscreen','minimal-ui'].includes(m.display);
    add('マニフェスト', res.ok && has192 && has512 && okDisp && !!m.name,
        'HTTP ' + res.status + ' / ' + ct + '\nname: ' + m.name +
        '\ndisplay: ' + m.display + '\nstart_url: ' + new URL(m.start_url, url).href +
        '\nicons: ' + sizes);
    // アイコンが本当に取れるか
    for(const s of ['icon-192.png','icon-512.png']){
      const r = await fetch(new URL(s, location.href).href);
      add('アイコン ' + s, r.ok, 'HTTP ' + r.status + ' / ' + (r.headers.get('content-type') || ''));
    }
  } catch(e){
    add('マニフェスト', false, String(e));
  }

  // サービスワーカー
  if(!('serviceWorker' in navigator)){
    add('Service Worker', false, 'このブラウザは対応していません');
  } else {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      add('Service Worker', true, 'scope: ' + reg.scope +
          '\n状態: ' + (reg.active ? 'active' : reg.installing ? 'installing' : 'waiting'));
    } catch(e){
      add('Service Worker', false, e.name + ': ' + e.message);
    }
  }

  // インストール済みか（Chrome のみ）
  if(navigator.getInstalledRelatedApps){
    try {
      const apps = await navigator.getInstalledRelatedApps();
      add('インストール済みの判定', apps.length === 0,
          apps.length ? JSON.stringify(apps) : 'この端末にはまだ入っていません');
    } catch(e){ add('インストール済みの判定', null, String(e)); }
  }

  add('beforeinstallprompt', null, '待っています…（10秒）');
  setTimeout(() => {
    if(!prompted){
      const i = rows.findIndex(r => r.k === 'beforeinstallprompt');
      rows[i] = {k:'beforeinstallprompt', state:false,
        v:'発火しませんでした。上の×印が原因です。すべて○なのにここだけ×なら、' +
          'すでにインストール済みか、ブラウザ側の設定（データセーバー、シークレットタブなど）が疑わしい。'};
      draw();
    }
  }, 10000);
})();

document.getElementById('install').onclick = async () => {
  if(!prompted) return;
  prompted.prompt();
  const r = await prompted.userChoice;
  add('インストールの返事', r.outcome === 'accepted', r.outcome);
};
document.getElementById('copy').onclick = async () => {
  const t = '【インストール診断】' + location.href + '\n' +
    rows.map(r => (r.state === true ? '○ ' : r.state === false ? '× ' : '… ') + r.k + ': ' + r.v).join('\n');
  try { await navigator.clipboard.writeText(t); alert('コピーしました'); }
  catch(e){ prompt('これをコピーしてください', t); }
};
</script>
</body>
</html>
