name = "my-routine-records"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# もそもそ奮闘記と同じドメインの下に置く（Cloudflare が DNS も作る）
routes = [
  { pattern = "records.mosomoso-history.com", custom_domain = true }
]

# npx wrangler kv namespace create RECORDS で作って、出てきた id をここに書く
[[kv_namespaces]]
binding = "RECORDS"
id = "7494fef09b5e4c9dbf151c23819b6b62"
