<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0672f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="マイメニュー">
<title>マイメニュー</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f4f1; --card:#fff; --text:#1c1c1e; --muted:#8a8a8e; --line:#e6e4de;
  --accent:#e0672f; --soft:#fbeee7; --ok:#4c9a5a; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#141416;--card:#1e1e21;--text:#f2f2f0;--muted:#8e8e93;--line:#2d2d31;
        --accent:#f08050;--soft:#2c1f19;--shadow:none}
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 8px}

.head{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px}
.head .date{font-size:22px;font-weight:700;letter-spacing:.02em}
.head .sub{font-size:13px;color:var(--muted)}
.streak{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.done{opacity:.72}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card-top b{font-size:17px}
.tag{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tag.ok{color:var(--ok);font-weight:600}
.items{font-size:13px;color:var(--muted);margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:11px 6px;border-radius:10px;background:var(--bg);
  border:1px solid var(--line);font-size:14px;font-weight:600}
.btns button.primary{background:var(--accent);color:#fff;border-color:transparent;flex:1.6}
.btns button.ghost{flex:.8;color:var(--muted);font-weight:500}

h2{font-size:14px;color:var(--muted);font-weight:600;margin:22px 2px 10px;letter-spacing:.04em}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:28px 10px;line-height:1.9}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .name{font-weight:600}
.row .meta{font-size:12px;color:var(--muted)}
.row .go{margin-left:auto;color:var(--muted);font-size:20px;line-height:1}
.addbtn{width:100%;padding:13px;border:1px dashed var(--line);border-radius:12px;
  color:var(--muted);font-weight:600;background:none;margin-top:4px}
.praise{background:var(--soft);border-radius:14px;padding:18px;text-align:center;
  font-weight:600;color:var(--accent);margin-bottom:12px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 2px 5px;font-weight:600}
.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
.field .inline{display:flex;gap:8px}
.days{display:flex;gap:4px}
.days button{flex:1;min-width:0;padding:10px 0;border-radius:9px;border:1px solid var(--line);
  background:var(--card);font-size:14px}
.days button.on{background:var(--accent);color:#fff;border-color:transparent;font-weight:700}
.mitem{background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin-bottom:8px}
.mitem .mhead{display:flex;align-items:center;gap:8px}
.mitem .grow{flex:1;min-width:0}
.mitem .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .mrow{display:flex;gap:8px;margin-top:8px}
.mitem input{width:100%;padding:8px 4px;text-align:center;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);font-size:15px}
.mitem .lbl{font-size:11px;color:var(--muted)}
.mitem .col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
.iconbtn{width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:16px;flex:none}
.bar{display:flex;gap:8px;margin:18px 0 8px}
.bar button{flex:1;padding:14px;border-radius:12px;font-weight:700;border:1px solid var(--line);
  background:var(--card)}
.bar button.primary{background:var(--accent);color:#fff;border-color:transparent}
.bar button.danger{color:#c0392b;flex:.6;font-weight:600}
.back{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;
  font-weight:600;padding:4px 2px;margin-bottom:8px}

#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
#tabs button{flex:1;padding:6px 0;font-size:11px;color:var(--muted);display:flex;
  flex-direction:column;align-items:center;gap:3px}
#tabs button .ic{font-size:19px;line-height:1}
#tabs button.on{color:var(--accent);font-weight:700}

body.running{padding-bottom:0}
body.running #tabs{display:none}
#run{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.rtop{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.rtop .stop{font-weight:600}
.rtop .mid{margin-left:auto;font-variant-numeric:tabular-nums}
.rbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:6px}
.rbody .nm{font-size:26px;font-weight:700}
.rbody .amt{font-size:64px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.rbody .amt small{font-size:24px;font-weight:600;color:var(--muted);margin-left:6px}
.rbody .set{font-size:15px;color:var(--muted)}
.rbody .rest{font-size:15px;color:var(--accent);font-weight:700;letter-spacing:.1em}
.rbody .cd{font-size:80px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.rbody .cd.paused{color:var(--muted)}
.rbtns{display:flex;flex-direction:column;gap:10px}
.rbtns button{padding:18px;border-radius:14px;font-size:17px;font-weight:700;
  background:var(--card);border:1px solid var(--line)}
.rbtns button.primary{background:var(--accent);color:#fff;border-color:transparent;font-size:19px}
.rbtns .side{display:flex;gap:10px}
.rbtns .side button{flex:1;font-size:15px;font-weight:600;color:var(--muted);padding:14px}
.prog{height:4px;background:var(--line);border-radius:2px;margin:10px 0 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}

.spot{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px}
.spot.done{opacity:.6}
.spot.done .nm{text-decoration:line-through}
.spot .grow{flex:1;min-width:0;background:none}
.spot .nm{font-weight:600;font-size:15px}
.spot .meta{font-size:12px;color:var(--muted);margin-top:1px}
.spot .get{padding:9px 14px;border-radius:10px;background:var(--accent);color:#fff;
  font-weight:700;font-size:14px;flex:none}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:14px}
.cats button.on{color:#fff;border-color:transparent;font-weight:700}
.ptpill{display:inline-flex;align-items:center;gap:4px;background:var(--soft);color:var(--accent);
  font-weight:800;font-size:13px;padding:4px 11px;border-radius:999px;white-space:nowrap}
.headright{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gain{font-size:54px;font-weight:800;color:var(--accent);line-height:1.1}
.gain small{font-size:22px;margin-left:4px}
.bd{margin-top:10px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.bd div{display:flex;justify-content:center;gap:10px}
.bd b{color:var(--text);font-variant-numeric:tabular-nums}
.lvwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.lvtop{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.lvtop .lv{font-size:19px;font-weight:800}
.lvtop .bal{margin-left:auto;font-size:13px;color:var(--muted)}
.lvbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--accent)}
.rw{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rw .grow{flex:1;min-width:0}
.rw .nm{font-weight:600}
.rw .cost{font-size:12px;color:var(--muted)}
.rw button.get{padding:9px 14px;border-radius:10px;background:var(--accent);color:#fff;
  font-weight:700;font-size:14px;flex:none}
.rw button.get:disabled{background:var(--line);color:var(--muted);font-weight:600}
.big{display:flex;gap:10px;margin-bottom:6px}
.big div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;text-align:center}
.big .n{font-size:26px;font-weight:800;line-height:1.2}
.big .l{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.heat{display:flex;gap:3px;overflow-x:auto;padding:4px 2px 8px}
.heat .wk{display:flex;flex-direction:column;gap:3px}
.heat .c{width:13px;height:13px;border-radius:3px;background:var(--line)}
.heat .c.l1{background:var(--accent);opacity:.35}
.heat .c.l2{background:var(--accent);opacity:.65}
.heat .c.l3{background:var(--accent)}
.heat .c.rest{background:var(--muted);opacity:.3}
.heat .c.future{background:transparent}
.legend{font-size:11px;color:var(--muted);display:flex;gap:12px;margin:0 2px 4px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 表紙。画像が無ければカテゴリの色に種類のアイコン */
.cover{width:56px;height:56px;border-radius:14px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:26px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));
  background-size:cover;background-position:center top;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.cover.has span{display:none}
.cover.busy{animation:coverpulse 1s ease-in-out infinite alternate}
@keyframes coverpulse{from{opacity:1}to{opacity:.45}}
.cover.sm{width:44px;height:44px;border-radius:11px;font-size:20px}
.cover.xs{width:28px;height:28px;border-radius:8px;font-size:14px;box-shadow:none}
.cover.xl{width:128px;height:128px;border-radius:26px;font-size:56px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);text-decoration:none;
  max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.k{--c:var(--text)}
.chip.link{--c:var(--muted)}
.thumbs{display:flex;gap:5px;margin:2px 0 8px;flex-wrap:wrap}
.coveredit{display:flex;align-items:center;gap:16px;margin:4px 2px 18px}
.coveredit .cebtns{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.pill{padding:9px 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:14px}
.pill.ghost{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.cats button.kon{background:var(--text);color:var(--bg);border-color:transparent;font-weight:700}
.minilink{color:var(--muted);font-size:12px;font-weight:600;padding:8px 2px 0;text-decoration:underline}
.spot .grow{cursor:pointer}
.spot.done .cover{filter:grayscale(1)}
.rbody .cover{margin-bottom:12px}
.rbody .chip.link{font-size:13px;padding:5px 12px;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importfile" accept="application/json,.json" style="display:none">
<input type="file" id="imgfile" accept="image/*" style="display:none">
<div id="gsi" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);
     align-items:center;justify-content:center;padding:24px">
  <div style="background:var(--card);border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center">
    <div style="font-weight:700;margin-bottom:6px">Googleで入る</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:16px">
      記録はこのアカウントにひもづきます。</div>
    <div id="gsibtn" style="display:flex;justify-content:center;min-height:44px"></div>
    <button id="gsicancel" style="margin-top:16px;color:var(--muted);font-size:14px;font-weight:600">やめる</button>
  </div>
</div>
<nav id="tabs">
  <button data-tab="today"><span class="ic">☀</span>今日</button>
  <button data-tab="menus"><span class="ic">☰</span>メニュー</button>
  <button data-tab="exercises"><span class="ic">◎</span>種目</button>
  <button data-tab="rewards"><span class="ic">★</span>ごほうび</button>
  <button data-tab="records"><span class="ic">▦</span>記録</button>
</nav>
<script>
'use strict';

/* ========== 基本 ========== */
const KEY = 'myroutine.v1';
const BUILD = '2.5';   // スマホで見てもらうとき、どの版かが分かるように
const UNITS = ['回','分','秒','セット','ページ','個','km','チェック'];
const DAYS = ['日','月','火','水','木','金','土'];
const COLORS = {orange:'#e0672f', green:'#4c9a5a', blue:'#3b7ea1',
                purple:'#7a5ea1', pink:'#c2566f', gray:'#7b7b80'};
// カテゴリ。色はここで決まる（種目とスポット作業で共通）
const CATS = [
  {id:'it',      name:'IT',         color:'blue'},
  {id:'finance', name:'ファイナンス', color:'green'},
  {id:'english', name:'英語',        color:'purple'},
  {id:'muscle',  name:'筋トレ',      color:'orange'},
  {id:'other',   name:'その他',      color:'gray'}
];
const catOf    = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
const catColor = id => COLORS[catOf(id).color];
// 種類（本・講座…）。最初からあるものはIDを固定し、自分で足したものも同期する
const DEFAULT_KINDS = [
  {id:'kind-book',     name:'本',         icon:'📖'},
  {id:'kind-course',   name:'講座',       icon:'🎓'},
  {id:'kind-app',      name:'アプリ',     icon:'📱'},
  {id:'kind-original', name:'オリジナル', icon:'✏️'},
  {id:'kind-other',    name:'その他',     icon:'📌'}
];
const kindOf = id => id ? (db.kinds || []).find(k => k.id === id) : null;
// 記録のあずかり所（worker/ を deploy したもの）。あいことばだけ自分で入れる
const SYNC_URL = 'https://records.mosomoso-history.com';
// Google ログインの宛先。空のあいだは、あいことば方式だけで動く
const GOOGLE_CLIENT_ID = '741461839274-i87gnanog6cqbqqqug5f9hgvvtaho7eg.apps.googleusercontent.com';

const uid = () => Math.random().toString(36).slice(2,9);
const pad = n => String(n).padStart(2,'0');
const fmtDate = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDate = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); };
const todayStr = () => fmtDate(new Date());
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

/* ========== データ ========== */
let db = load();
let view = {name:'today'};
let run = null;
let installEvt = null;   // Chrome が「入れられる」と言ってきたら入る

function seed(){
  // IDは固定。別の端末で初期データが作られても、同じものとして扱われる
  const ex = (id,name,unit,amount,cat,minutes) => ({id:'seed-'+id, name, unit, amount, cat, minutes});
  const stretch = ex('stretch','ストレッチ','チェック',0,'muscle',5);
  const squat   = ex('squat','スクワット','回',30,'muscle',5);
  const pushup  = ex('pushup','腕立て伏せ','回',20,'muscle',5);
  const plank   = ex('plank','プランク','秒',60,'muscle',2);
  const words   = ex('words','英単語','個',20,'english',15);
  const read    = ex('read','読書','分',15,'other',15);
  return {
    exercises:[stretch,squat,pushup,plank,words,read],
    menus:[
      {id:'seed-morning', name:'朝メニュー', days:[0,1,2,3,4,5,6], time:'07:00', items:[
        {exerciseId:stretch.id, amount:0,  sets:1, rest:0},
        {exerciseId:squat.id,   amount:30, sets:1, rest:0},
        {exerciseId:read.id,    amount:15, sets:1, rest:0}]},
      {id:'seed-gym', name:'筋トレの日', days:[1,3,5], time:'19:00', items:[
        {exerciseId:pushup.id, amount:20, sets:3, rest:60},
        {exerciseId:squat.id,  amount:30, sets:2, rest:60},
        {exerciseId:plank.id,  amount:60, sets:1, rest:0}]},
      {id:'seed-night', name:'夜の勉強', days:[0,1,2,3,4,5,6], time:'21:00', items:[
        {exerciseId:words.id, amount:20, sets:1, rest:0}]}
    ],
    logs:[],
    spots:[
      {id:'seed-tax', name:'確定申告の書類をそろえる', cat:'finance', minutes:60,
       date:'', done:false}
    ],
    rewards:[
      {id:'seed-ramen', name:'好きなラーメンを食べる', cost:60},
      {id:'seed-game', name:'ゲーム1時間', cost:24},
      {id:'seed-manga', name:'マンガを1冊買う', cost:36}
    ],
    redemptions:[],
    kinds:JSON.parse(JSON.stringify(DEFAULT_KINDS)),
    // 送信先とあいことばは、この端末の中だけ。送るデータには入らない
    sync:{url:SYNC_URL, key:'', auto:false, device:''},
    graves:[], version:0,
    // まっさらの状態は「この端末で変えた」に数えない。
    // でないと、初めての端末で必ず取り合いの確認が出てしまう
    updatedAt:0, syncedAt:0
  };
}
function load(){
  let d = null;
  try { const s = localStorage.getItem(KEY); if(s) d = JSON.parse(s); } catch(e){}
  if(!d) return seed();
  return migrate(d);
}
/* 古いデータを今の形に直す。取り込んだデータにも通す */
function migrate(d){
  if(!d.rewards) d.rewards = [];
  if(!d.redemptions) d.redemptions = [];
  if(!d.spots) d.spots = [];
  if(!d.sync) d.sync = {url:'', key:'', auto:false};
  if(!d.sync.device) d.sync.device = '';
  if(typeof d.updatedAt !== 'number') d.updatedAt = Date.now();
  if(typeof d.syncedAt !== 'number') d.syncedAt = 0;
  if(typeof d.version !== 'number') d.version = 0;
  if(!Array.isArray(d.graves)) d.graves = [];
  if(!Array.isArray(d.kinds)) d.kinds = JSON.parse(JSON.stringify(DEFAULT_KINDS));
  d.logs.forEach(l => { if(l.mode === 'mini') l.mode = 'full'; });   // ミニ版は廃止した
  if(!d.sync.url) d.sync.url = SYNC_URL;
  d.exercises.forEach(e => {
    delete e.points;   // ポイントは時間から決まるようになった
    // カテゴリと目安の時間は後から足した。色から見当をつけ、分の種目は量をそのまま使う
    if(!e.cat) e.cat = e.color === 'orange' ? 'muscle' : e.color === 'blue' ? 'it' : 'other';
    if(typeof e.minutes !== 'number') e.minutes = e.unit === '分' ? (e.amount || 0) : 0;
  });
  d.logs.forEach(l => {
    if(typeof l.points === 'number') return;
    if(l.mode === 'rest' || !l.entries){ l.points = 0; return; }
    let min = 0, all = true;
    l.entries.forEach(en => {
      const e = d.exercises.find(x => x.id === en.exerciseId);
      if(!en.done){ all = false; return; }
      min += en.minutes || (e ? e.minutes || 0 : 0);
    });
    l.points = Math.floor(min / 5) + (all && l.entries.length ? 1 : 0);
  });
  return d;
}
/* 変えたときは save()。取り込んだものを書くだけなら saveQuiet()
   （updatedAt を動かすと「この端末の方が新しい」と誤解されるため）  */

  db.updatedAt = Date.now();
  saveQuiet();

}
function saveQuiet(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }

const exById   = id => db.exercises.find(e => e.id === id);
const menuById = id => db.menus.find(m => m.id === id);
const menusOn  = date => db.menus.filter(m => m.days.includes(date.getDay()));
const logsOn   = ds => db.logs.filter(l => l.date === ds);

/* スポット作業＝1回かぎりの用事。予定日が来たら「今日」に出る */

// 日を決めた用事で、今日ぶんと過ぎたもの

                                   .sort((a,b) => a.date.localeCompare(b.date));

const spotsSomeday = () => db.spots.filter(s => !s.done && !s.date);
// 先の日を決めた用事

                                   .sort((a,b) => a.date.localeCompare(b.date));
function minutesText(m){
  if(!m) return '';
  return m >= 60 ? (m % 60 ? Math.floor(m/60) + '時間' + (m%60) + '分' : Math.floor(m/60) + '時間')
                 : m + '分';
}
/* 今日これからやる分の、目安の合計時間 */
function todayMinutes(){
  const ds = todayStr();
  let m = 0;
  menusOn(new Date()).forEach(mn => {
    const log = logFor(ds, mn.id);
    if(log && log.mode !== 'part') return;                 // 終わった・休んだメニューは数えない
    const done = log ? (log.entries || []).filter(en => en.done).map(en => en.exerciseId) : [];
    mn.items.forEach(it => {
      const at = done.indexOf(it.exerciseId);
      if(at >= 0){ done.splice(at, 1); return; }           // 済んだ種目は差し引く
      const e = exById(it.exerciseId);
      if(e) m += (e.minutes || 0) * Math.max(1, it.sets);
    });
  });
  spotsToday().forEach(s => { m += s.minutes || 0; });
  return m;
}

function amountText(amount, unit){
  if(unit === 'チェック') return '';
  return amount + unit;
}
function itemText(it){
  const e = exById(it.exerciseId);
  if(!e) return '';
  let s = e.name;
  const a = amountText(it.amount, e.unit);
  if(a) s += ' ' + a;
  if(it.sets > 1) s += '×' + it.sets;

/* ========== ポイント ==========
   種目を1つ終えるたびに、その種目のポイント。
   ぜんぶ終えたら完了ボーナス。その日の最初の1本に連続ボーナス。
                                                                   */
const MIN_PER_PT = 5;          // 5分で1ポイント。5分に足りないぶんは切り捨て
const COMPLETE_BONUS = 1;      // メニューやスポット作業をやりきったら
const STREAK_BONUS_MAX = 5;    // その日の1本目にもらえる連続ボーナスの上限
const ptFromMin = m => Math.floor((m || 0) / MIN_PER_PT);
const streakBonusOf = st => Math.min(Math.ceil(st / 7), STREAK_BONUS_MAX);

function earned(){ return db.logs.reduce((s,l) => s + (l.points || 0), 0); }
function spent(){ return db.redemptions.reduce((s,r) => s + r.cost, 0); }
function balance(){ return earned() - spent(); }
function level(){ return Math.floor(earned() / 100) + 1; }
function levelRest(){ return 100 - (earned() % 100); }
function ptOn(ds){ return logsOn(ds).reduce((s,l) => s + (l.points || 0), 0); }
function menuPoints(m){
  let min = 0;
  m.items.forEach(it => {
    const e = exById(it.exerciseId);
    if(e) min += (e.minutes || 0) * Math.max(1, it.sets);
  });
  return ptFromMin(min) + (m.items.length ? COMPLETE_BONUS : 0);
}
function menuMinutes(m){
  let min = 0;
  m.items.forEach(it => {
    const e = exById(it.exerciseId);
    if(e) min += (e.minutes || 0) * Math.max(1, it.sets);
  });
  return min;
}

/* 実行が終わったときの内訳を作る */
function runPoints(complete){
  let min = 0;
  run.queue.filter(q => q.done).forEach(q => { min += q.minutes * (q.setDone || 0); });
  const base = Math.max(0, ptFromMin(min) - (run.awarded || 0));
  const bonus = complete ? COMPLETE_BONUS : 0;
  // その日ぜんぶで最初の1本なら連続ボーナス
  const first = !logsOn(todayStr()).some(l => l.mode === 'full' || l.mode === 'part' || l.mode === 'spot');
  const st = first ? Math.max(1, streak() + 1) : 0;   // まだ保存前なので今日のぶんを足す
  const sb = first ? streakBonusOf(st) : 0;
  const doneCount = run.queue.filter(q => q.done).length;
  return {minutes:min, base, bonus, streakDays:st, streakBonus:sb, complete,
          doneCount, all:run.queue.length, total:base + bonus + sb};
}

/* ========== サイトに載せる用の書き出し ==========
   公開するのは数字だけ。種目名・作業名・ごほうびの中身は入れない。     */
function summary(){
  const now = new Date();
  const days = {};
  const touch = ds => (days[ds] = days[ds] || {d:ds, lv:0, pt:0, min:0});
  const cats = {};
  const bumpCat = (id, times, min, pt) => {
    const c = cats[id] = cats[id] || {times:0, minutes:0, points:0};
    c.times += times; c.minutes += min; c.points += pt;
  };
  // 明細：何に時間を使ったかを、名前ごとにまとめる
  const items = {};
  const bumpItem = (name, cat, min) => {
    const k = cat + '␀' + name;
    const it = items[k] = items[k] || {name, cat, times:0, minutes:0};
    it.times++; it.minutes += min;
  };

  db.logs.forEach(l => {
    const day = touch(l.date);
    day.pt += l.points || 0;
    if(l.mode === 'rest'){ day.lv = Math.max(day.lv, 0); day.rest = true; return; }
    if(l.mode === 'spot'){
      day.min += l.minutes || 0;
      day.lv = day.lv >= 1 ? 3 : 1;
      bumpCat(l.cat || 'other', 1, l.minutes || 0, l.points || 0);
      if(l.name) bumpItem(l.name, l.cat || 'other', l.minutes || 0);
      return;
    }
    const done = (l.entries || []).filter(en => en.done);
    const weight = done.reduce((s,en) => {
      const e = exById(en.exerciseId);
      return s + (en.minutes || (e ? e.minutes || 0 : 0));
    }, 0);
    done.forEach(en => {
      const e = exById(en.exerciseId);
      if(!e) return;
      const min = en.minutes || e.minutes || 0;
      day.min += min;
      bumpCat(e.cat, 1, min, Math.round(weight ? (l.points || 0) * min / weight
                                               : (l.points || 0) / done.length));
      bumpItem(e.name, e.cat, min);
    });
    day.lv = day.lv >= 1 ? 3 : (l.mode === 'full' ? 2 : 1);   // part は 1
  });

  // いちばん長く続いた日数。ストリークと同じ数え方をする
  // （休んだ日と、予定のない日では切れない）
  const ds = Object.keys(days).sort();
  let best = 0, cur = 0;
  if(ds.length){
    for(let d = parseDate(ds[0]); d <= now; d = addDays(d, 1)){
      const k = fmtDate(d), day = days[k];
      if(day && day.lv > 0){ cur++; best = Math.max(best, cur); }
      else if((day && day.rest) || !menusOn(d).length){ /* 切れない */ }
      else cur = 0;
    }
  }

  return {
    generated: fmtDate(now) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
    build: BUILD,
    streak: streak(),
    bestStreak: best,
    level: level(),
    points: earned(),
    totalTimes: db.logs.filter(l => l.mode !== 'rest').length,
    totalMinutes: Object.values(days).reduce((s,x) => s + x.min, 0),
    cats: CATS.filter(c => cats[c.id]).map(c => Object.assign(
      {id:c.id, name:c.name, color:COLORS[c.color]}, cats[c.id])),
    items: Object.values(items).sort((a,b) => b.minutes - a.minutes || b.times - a.times)
                               .slice(0, 60),
    days: ds.map(d => days[d]).filter(x => x.lv > 0 || x.rest)
  };
}

/* 書き出したものを、あずかり所へ送る。失敗しても記録そのものは無事 */
/* ===== 1件ずつのマージ =====
   塊で上書きするのをやめる。レコードのIDで突き合わせ、
   両方にあるものは新しい方、片方にしかないものは必ず残す。
   消したものは「墓標」を送って伝える。                            */
const LISTS = ['exercises','menus','logs','spots','rewards','redemptions','kinds'];
const GRAVE_DAYS = 90;

function stamp(rec){ rec.up = Date.now(); return rec; }
function bury(id){
  if(!id) return;
  db.graves = db.graves || [];
  db.graves = db.graves.filter(g => g.id !== id);
  db.graves.push({id, at:Date.now()});
}
function purgeGraves(d){
  const limit = Date.now() - GRAVE_DAYS * 86400000;
  d.graves = (d.graves || []).filter(g => (g.at || 0) > limit);
}

function mergeDb(mine, theirs){
  const graves = new Map();
  [...(mine.graves || []), ...(theirs.graves || [])].forEach(g => {
    graves.set(g.id, Math.max(graves.get(g.id) || 0, g.at || 0));
  });
  const out = {};
  LISTS.forEach(k => {
    const m = new Map();
    (mine[k] || []).forEach(r => { if(r && r.id) m.set(r.id, r); });
    (theirs[k] || []).forEach(r => {
      if(!r || !r.id) return;
      const cur = m.get(r.id);
      if(!cur || (r.up || 0) > (cur.up || 0)) m.set(r.id, r);
    });
    // 消した時刻より後に書かれたものは生き残る（消したあとに作り直した場合）
    out[k] = [...m.values()].filter(r => !(graves.has(r.id) && (r.up || 0) <= graves.get(r.id)));
  });
  out.graves = [...graves].map(([id, at]) => ({id, at}));
  out.sync = mine.sync;
  out.updatedAt = Math.max(mine.updatedAt || 0, theirs.updatedAt || 0);
  out.version = mine.version || 0;
  purgeGraves(out);
  return out;
}

/* ===== 同期 =====
   あずかり所に「データ一式」と「ブログ用の集計」を置く。
   あいことばを入れた端末どうしで中身がそろう。                      */
const syncReady = () => !!(db.sync && db.sync.url && (db.sync.key || db.sync.token));
const authHead = () => db.sync.token ? {'x-token':db.sync.token} : {'x-key':db.sync.key || ''};
const whoAmI = () => db.sync.email || db.sync.device || '名前なし';
const dataUrl = () => db.sync.url.replace(/\/+$/, '') + '/data';
const nowStamp = () => { const n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); };

/* 送る中身。URL・あいことば・端末名は送らない（端末ごとのものなので） */
function dataPayload(){
  const c = Object.assign({}, db);
  delete c.sync;
  delete c.version;     // 版はサーバーが持つ
  return c;
}

function syncPush(manual, retry){
  if(!syncReady()) return Promise.resolve(false);
  const stamp2 = nowStamp();
  return fetch(dataUrl(), {method:'POST',
      headers:Object.assign({'content-type':'application/json'}, authHead()),
      body:JSON.stringify({baseVersion:db.version || 0, data:dataPayload()})})
    .then(r => r.json().then(body => ({status:r.status, ok:r.ok, body})))
    .then(res => {
      if(res.status === 409){
        // 向こうが進んでいた。混ぜてから、もう一度だけ出す
        if(retry) throw '409';
        if(res.body && res.body.data){
          db = mergeDb(db, res.body.data);
          db.version = res.body.version || 0;
          saveQuiet();
          render();
        } else {
          db.version = res.body.version || 0;
          saveQuiet();
        }
        return syncPush(manual, true);
      }
      if(!res.ok) throw res.status;
      db.version = res.body.version;
      db.syncedAt = db.updatedAt;
      db.sync.last = stamp2 + ' 送信';
      saveQuiet();
      return fetch(db.sync.url, {method:'POST',
        headers:Object.assign({'content-type':'application/json'}, authHead()),
        body:JSON.stringify(summary())}).catch(() => {});
    })
    .then(() => { if(manual){ alert('同期しました。'); render(); } return true; })
    .catch(e => {
      db.sync.last = stamp2 + ' 失敗（' + (e === 403 ? 'あいことば' : e || 'つながらない') + '）';
      saveQuiet();
      if(manual){ alert(syncMsg(e)); render(); }
      return false;
    });
}

function syncPull(manual){
  if(!syncReady()){ if(manual) alert('あいことばを入れてください。'); return Promise.resolve(false); }
  const stamp2 = nowStamp();
  return fetch(dataUrl(), {headers:authHead()})
    .then(r => { if(!r.ok) throw r.status; return r.json(); })
    .then(remote => {
      const theirs = remote && remote.data;
      const ver = remote ? (remote.version || 0) : 0;
      if(!theirs || !Array.isArray(theirs.logs)){
        db.version = ver;
        saveQuiet();
        return syncPush(manual);          // 向こうが空。こちらを置く
      }
      const before = JSON.stringify(LISTS.map(k => (db[k] || []).length));
      // 一度も触っていない端末は、初期データを持ちこまずに受け取るだけ
      const untouched = !(db.updatedAt || 0);
      if(untouched){
        const keep = db.sync;
        db = migrate(theirs);
        db.sync = keep;
      } else {
        db = mergeDb(db, theirs);
      }
      db.version = ver;
      const after = JSON.stringify(LISTS.map(k => (db[k] || []).length));
      db.sync.last = stamp2 + (before === after ? ' 同期ずみ' : ' 取り込み');
      saveQuiet();
      imgMissing.clear();
      flushImgs();
      render();
      // 混ぜた結果が向こうと違うなら、こちらからも出す
      if(before !== after || (db.updatedAt || 0) > (db.syncedAt || 0)) return syncPush(manual);
      if(manual){ alert('すでに最新です。'); render(); }
      return true;
    })
    .catch(e => {
      db.sync.last = stamp2 + ' 失敗（' + (e === 403 ? 'あいことば' : e || 'つながらない') + '）';
      saveQuiet();
      if(manual){ alert(syncMsg(e)); render(); }
      return false;
    });
}

function syncMsg(e){
  if(e === 403) return 'あいことばが違います。';
  if(e === 400) return 'アプリが古いようです。ページを再読み込みしてください。'
              + '（Windowsなら Ctrl+Shift+R）';
  if(e === '409') return '同時に書き込まれました。もう一度押してください。';
  if(e === 413) return '記録が大きすぎて送れません。';
  return '同期できませんでした（' + (e || 'つながりません') + '）';
}

/* ===== Google で入る ===== */
function googleLogin(){
  if(!GOOGLE_CLIENT_ID){ alert('Googleログインはまだ設定されていません。'); return; }
  const panel = document.getElementById('gsi');
  panel.style.display = 'flex';
  const start = () => {
    try {
      google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:onGoogle,
                                     auto_select:false, cancel_on_tap_outside:true});
      document.getElementById('gsibtn').innerHTML = '';
      google.accounts.id.renderButton(document.getElementById('gsibtn'),
        {theme:'outline', size:'large', shape:'pill', text:'signin_with', locale:'ja'});
    } catch(e){
      panel.style.display = 'none';
      alert('Googleの画面を出せませんでした。');
    }
  };
  if(window.google && google.accounts){ start(); return; }
  const sc = document.createElement('script');
  sc.src = 'https://accounts.google.com/gsi/client';
  sc.async = true;
  sc.onload = start;
  sc.onerror = () => { panel.style.display = 'none'; alert('Googleに接続できませんでした。'); };

function onGoogle(res){
  document.getElementById('gsi').style.display = 'none';
  fetch(db.sync.url.replace(/\/+$/, '') + '/auth/google', {method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({idToken:res.credential})})
    .then(r => r.json().then(b => ({ok:r.ok, b})))
    .then(({ok, b}) => {
      if(!ok) throw b.error || 'だめでした';
      db.sync.token = b.token;
      db.sync.email = b.email;
      saveQuiet();

/* 変えるたびに送る。連打しても1回にまとめる */
let pushTimer = null;
function schedulePush(){
  if(!syncReady() || !db.sync.auto) return;
  if(!db.syncedAt && !db.logs.length) return;   // まだ何も無い端末から送らない
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => syncPush(false), 2500);
}
const autoSend = () => schedulePush();

/* ========== ストリーク ========== */
function streak(){
  let n = 0, d = new Date();
  for(let i = 0; i < 400; i++){
    const ds = fmtDate(d);
    const ls = logsOn(ds);
    const did  = ls.some(l => l.mode === 'full' || l.mode === 'part' || l.mode === 'spot');
    const rest = ls.some(l => l.mode === 'rest');
    const sched = menusOn(d).length > 0;
    if(did) n++;
    else if(rest || !sched){ /* 休んだ日と予定のない日は切らない */ }
    else if(i > 0) break;          // 今日はまだ途中なので切らない
    d = addDays(d, -1);
  }
  return n;
}

  spots.forEach(s => { h += spotRow(s, ds); });
  h += '<button class="addbtn" data-act="newspot">＋ スポット作業を足す</button>';

  if(someday.length){
    h += '<h2>いつかやる</h2>';
    someday.forEach(s => { h += spotRow(s, ds); });
  }

  const later = spotsLater();
  if(later.length){
    h += '<h2>この先の予定</h2>';
    later.forEach(s => { h += spotRow(s, ds, true); });
  }
  const doneSpots = db.spots.filter(s => s.done && s.doneDate === ds);
  if(doneSpots.length){
    h += '<h2>今日おわらせた</h2>';
    doneSpots.forEach(s => { h += spotRow(s, ds); });
  }

  if(others.length){
    h += '<h2>ほかのメニュー</h2>';
    others.forEach(m => { h += menuCard(m, ds, true); });
  }
  return h + '</div>';
}

function spotRow(s, ds, later){
  const late = !s.done && s.date && s.date < ds;
  const meta = [s.spent ? 'ここまで ' + minutesText(s.spent) + '／' + (s.earned || 0) + 'pt'
                        : (s.minutes ? '目安 ' + minutesText(s.minutes) : ''),
                late ? '<b style="color:var(--accent)">' + daysLate(s.date, ds) + '日すぎ</b>' : '',
                later && s.date ? mdText(s.date) : '',
                s.done && s.doneDate ? mdText(s.doneDate) + ' にやった' : '']
    .filter(Boolean).join(' ・ ');
  return '<div class="spot' + (s.done ? ' done' : '') + '">' + cover(s) +
    '<div class="grow" data-act="editspot" data-id="' + s.id + '">' +
    '<div class="nm">' + esc(s.name) + '</div>' + chips(s) +
    (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div>' +
    (s.done
      ? '<button class="iconbtn" data-act="undospot" data-id="' + s.id + '">↩</button>'
      : '<button class="get" data-act="startspot" data-id="' + s.id + '">' +
        (s.spent ? 'つづき' : 'はじめる') + '</button>') +
    '</div>';
}
/* 表紙・札（カテゴリ／種類／参考URL） */
function cover(rec, size){
  const k = kindOf(rec.kind);
  return '<div class="cover' + (size ? ' ' + size : '') + '"' +
    (rec.img ? ' data-img="' + esc(rec.img) + '"' : '') +
    ' style="--c:' + catColor(rec.cat) + '"><span>' +
    (k ? k.icon : esc(catOf(rec.cat).name.slice(0,1))) + '</span></div>';
}
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch(e){ return u; } };
function urlChip(rec, label){
  const u = safeUrl(rec.url);
  if(!u) return '';
  return '<a class="chip link" href="' + esc(u) + '" target="_blank" rel="noopener">🔗 ' +
    esc(label || hostOf(u)) + '</a>';
}
// link=false のときは、ボタンの中に置くのでリンクにしない
function chips(rec, link){
  const k = kindOf(rec.kind), u = safeUrl(rec.url);
  return '<div class="chips"><span class="chip" style="--c:' + catColor(rec.cat) + '">' +
    catOf(rec.cat).name + '</span>' +
    (k ? '<span class="chip k">' + k.icon + ' ' + esc(k.name) + '</span>' : '') +
    (u ? (link === false ? '<span class="chip link">🔗 ' + esc(hostOf(u)) + '</span>' : urlChip(rec)) : '') +
    '</div>';
}
const mdText = ds => { const d = parseDate(ds); return (d.getMonth()+1) + '/' + d.getDate(); };
const daysLate = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);

const doneOf = log => (log.entries || []).filter(en => en.done).length;

function menuCard(m, ds, other){
  const log = logFor(ds, m.id);
  const desc = m.items.map(itemText).filter(Boolean).join('・') || '種目が入っていません';
  let h = '<div class="card' + (log ? ' done' : '') + '">' +
    '<div class="card-top"><b>' + esc(m.name) + '</b>' +
    '<span class="tag' + (log && log.mode === 'full' ? ' ok' : '') + '">' +
      (log ? (log.mode === 'rest' ? '休んだ'
              : (log.mode === 'part'
                  ? '途中まで ' + doneOf(log) + '/' + m.items.length
                  : '✓ 完了') + (log.points ? ' +' + log.points + 'pt' : ''))
           : (other ? '' : m.time || '')) +
    '</span></div>' +
    (m.items.length ? '<div class="thumbs">' + m.items.map(it => exById(it.exerciseId))
        .filter(Boolean).map(e => cover(e, 'xs')).join('') + '</div>' : '') +
    '<div class="items">' + esc(desc) + '</div>' +
    (!log && m.items.length ? '<div class="items" style="margin-bottom:10px">やりきると <b style="color:var(--accent)">+' +
      menuPoints(m) + 'pt</b></div>' : '') +
    (log && log.mode === 'part' ? '<div class="items" style="margin-bottom:10px">' +
      'のこり ' + (m.items.length - doneOf(log)) + '種目</div>' : '') +
    '<div class="btns">';
  if(log && log.mode === 'part'){
    h += '<button class="primary" data-act="start" data-id="' + m.id + '">つづき</button>' +
         '<button class="ghost" data-act="undo" data-id="' + m.id + '">取り消す</button>';
  } else if(log){
    h += '<button data-act="undo" data-id="' + m.id + '">取り消す</button>' +
         '<button class="ghost" data-act="start" data-id="' + m.id + '">もう一度</button>';
  } else if(!m.items.length){
    h += '<button data-act="editmenu" data-id="' + m.id + '">種目を入れる</button>';
  } else {
    h += '<button class="primary" data-act="start" data-id="' + m.id + '">はじめる</button>' +
         (other ? '' : '<button class="ghost" data-act="rest" data-id="' + m.id + '">休む</button>');
  }
  return h + '</div></div>';
}

/* ========== 画面：記録 ========== */
function viewRecords(){
  const st = streak();
  const done = db.logs.filter(l => l.mode !== 'rest');
  // 今週（日曜はじまり）
  const now = new Date();
  const weekStart = addDays(now, -now.getDay());
  let wDone = 0, wPlan = 0;
  for(let i = 0; i <= now.getDay(); i++){
    const d = addDays(weekStart, i);
    wPlan += menusOn(d).length;
    wDone += logsOn(fmtDate(d)).filter(l => l.mode === 'full' || l.mode === 'part').length;
  }
  let wPt = 0;
  for(let i = 0; i <= now.getDay(); i++) wPt += ptOn(fmtDate(addDays(weekStart, i)));

  let h = '<div class="wrap"><div class="head"><div class="date">記録</div>' +
    '<div class="ptpill">★ ' + balance() + ' pt</div></div>' +
    '<div class="big"><div><div class="n">' + st + '</div><div class="l">連続日数</div></div>' +
    '<div><div class="n">' + wDone + '/' + wPlan + '</div><div class="l">今週の回数</div></div>' +
    '<div><div class="n">' + wPt + '</div><div class="l">今週のpt</div></div></div>' +
    '<div class="big"><div><div class="n">' + level() + '</div><div class="l">レベル</div></div>' +
    '<div><div class="n">' + earned() + '</div><div class="l">ためたpt</div></div>' +
    '<div><div class="n">' + done.length + '</div><div class="l">通算の回数</div></div></div>';

  // 草カレンダー（18週）
  const weeks = 18;
  const end = addDays(now, 6 - now.getDay());
  const start = addDays(end, -(weeks * 7 - 1));
  h += '<h2>つみかさね</h2><div class="heat">';
  for(let w = 0; w < weeks; w++){
    h += '<div class="wk">';
    for(let dow = 0; dow < 7; dow++){
      const d = addDays(start, w * 7 + dow);
      const ds = fmtDate(d);
      let cls = 'c';
      if(d > now) cls += ' future';
      else {
        const ls = logsOn(ds);
        const full = ls.filter(l => l.mode === 'full').length;
        const some = ls.filter(l => l.mode === 'part' || l.mode === 'spot').length;
        if(full + some >= 2) cls += ' l3';
        else if(full) cls += ' l2';
        else if(some) cls += ' l1';
        else if(ls.some(l => l.mode === 'rest')) cls += ' rest';
      }
      h += '<div class="' + cls + '" title="' + ds + '"></div>';
    }
    h += '</div>';
  }
  h += '</div><div class="legend"><span><i class="c l1" style="background:var(--accent);opacity:.35"></i>すこし</span>' +
    '<span><i style="background:var(--accent)"></i>完了</span>' +
    '<span><i style="background:var(--muted);opacity:.3"></i>休んだ</span></div>';

  // 直近30日のカテゴリごとの合計
  const from = fmtDate(addDays(now, -29));
  const byCat = {};
  const bump = (cat, times, minutes, points) => {
    if(!byCat[cat]) byCat[cat] = {times:0, minutes:0, points:0};
    byCat[cat].times  += times;
    byCat[cat].minutes += minutes;
    byCat[cat].points += points;
  };
  db.logs.filter(l => l.date >= from).forEach(l => {
    if(l.mode === 'rest') return;
    if(l.mode === 'spot'){ bump(l.cat || 'other', 1, l.minutes || 0, l.points || 0); return; }
    if(!l.entries) return;
    const doneEntries = l.entries.filter(en => en.done);
    // メニューのポイントは1本ぶんをまとめて持っているので、種目の重みで割って配る
    const weight = doneEntries.reduce((s,en) => {
      const e = exById(en.exerciseId);
      return s + (en.minutes || (e ? e.minutes || 0 : 0));
    }, 0);
    doneEntries.forEach(en => {
      const e = exById(en.exerciseId);
      if(!e) return;
      const mn = en.minutes || e.minutes || 0;
      const share = weight ? (l.points || 0) * mn / weight
                           : (l.points || 0) / doneEntries.length;
      bump(e.cat, 1, en.minutes || e.minutes || 0, Math.round(share));
    });
  });
  const catRows = CATS.map(c => Object.assign({c}, byCat[c.id] || {times:0, minutes:0, points:0}))
                      .filter(r => r.times > 0)
                      .sort((a,b) => b.minutes - a.minutes || b.times - a.times);
  const maxMin = Math.max(1, ...catRows.map(r => r.minutes));
  h += '<h2>この30日 カテゴリ別</h2>';
  if(!catRows.length) h += '<div class="empty">まだ記録がありません。</div>';
  catRows.forEach(r => {
    h += '<div class="row" style="display:block"><div style="display:flex;align-items:center;gap:10px">' +
      '<span class="dot" style="background:' + COLORS[r.c.color] + '"></span>' +
      '<div class="name">' + r.c.name + '</div>' +
      '<div class="meta" style="margin-left:auto">' + r.times + '回 ・ ' +
      (r.minutes ? minutesText(r.minutes) + ' ・ ' : '') + r.points + 'pt</div></div>' +
      '<div class="lvbar" style="margin-top:8px"><i style="width:' +
      Math.round(r.minutes / maxMin * 100) + '%;background:' + COLORS[r.c.color] + '"></i></div></div>';
  });

  // 直近30日の種目ごとの合計
  const tot = {};
  db.logs.filter(l => l.date >= from && l.entries).forEach(l => {
    l.entries.filter(en => en.done).forEach(en => {
      const e = exById(en.exerciseId);
      if(!e) return;
      if(!tot[e.id]) tot[e.id] = {e, amount:0, times:0};
      tot[e.id].amount += en.amount || 0;
      tot[e.id].times++;
    });
  });
  const rows = Object.values(tot).sort((a,b) => b.times - a.times);
  h += '<h2>この30日 種目ごと</h2>';
  rows.forEach(r => {
    h += '<div class="row"><span class="dot" style="background:' + catColor(r.e.cat) + '"></span>' +
      '<div><div class="name">' + esc(r.e.name) + '</div>' +
      '<div class="meta">' + r.times + '回やった' +
      (r.e.unit !== 'チェック' ? ' ・ 合計 ' + r.amount + r.e.unit : '') + '</div></div></div>';
  });

  // サイトに載せる用の書き出し
  h += '<h2>サイトに載せる</h2>' +
    '<div class="card"><div class="items" style="margin-bottom:12px">' +
    'もそもそ奮闘記に載せる用のデータを作ります。日ごとの時間とポイント、' +
    'カテゴリ別の合計、それに<b>何をやったかの名前</b>（種目名・スポット作業名）が入ります。' +
    'ごほうびの中身と、メモのたぐいは入りません。</div>' +
    '<div class="btns"><button class="primary" data-act="export">書き出してコピー</button>' +
    '<button data-act="exportfile">ファイルで保存</button></div>' +
    '<div id="exportbox" style="display:none;margin-top:10px">' +
    '<textarea id="exporttext" readonly style="width:100%;height:120px;font-size:11px;' +
    'border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);' +
    'color:var(--text);font-family:monospace"></textarea>' +
    '<div class="items">コピーできないときは、ここを長押しして選んでください。</div></div></div>';

  // 同期の設定
  const sy = db.sync || {};
  h += '<h2>同期</h2>' +
    '<div class="card"><div class="card-top"><b>' +
    (sy.email ? esc(sy.email) : 'この端末：' + esc(sy.device || '名前なし')) + '</b>' +
    '<span class="tag' + (sy.last && sy.last.indexOf('失敗') < 0 ? ' ok' : '') + '">' +
    esc(sy.last || 'まだ同期していません') + '</span></div>' +
    '<div class="items" style="-webkit-line-clamp:none;display:block;margin-bottom:10px">' +
    'あいことばを入れた端末どうしで、記録の中身がそろいます。' +
    'スマホとパソコンで同じものが見られます。' +
    'URL・あいことば・端末名は、この端末の中だけに入ります。</div>' +
    '<div class="field"><label>この端末の名前</label>' +
    '<input data-sync="device" value="' + esc(sy.device || '') + '" placeholder="スマホ／パソコン"></div>' +
    '<div class="field"><label>あずかり所のURL</label>' +
    '<input data-sync="url" value="' + esc(sy.url || '') + '"></div>' +
    (sy.token ? '' :
      '<div class="field"><label>あいことば</label>' +
      '<input type="password" data-sync="key" value="' + esc(sy.key || '') + '"></div>') +
    (GOOGLE_CLIENT_ID
      ? '<div class="btns" style="margin-bottom:12px">' +
        (sy.token
          ? '<button data-act="glogout">' + esc(sy.email || '') + ' から出る</button>'
          : '<button data-act="glogin">Googleで入る</button>') + '</div>'
      : '') +
    '<label style="display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:12px">' +
    '<input type="checkbox" data-sync="auto" style="width:20px;height:20px"' +
    (sy.auto ? ' checked' : '') + '>変えるたびに自動で送る</label>' +
    '<div class="btns"><button class="primary" data-act="syncnow">いま同期する</button>' +
    '<button data-act="sendnow">送るだけ</button></div>' +
    '</div>';

  // 最近の記録
  const recent = db.logs.slice().sort((a,b) => b.date.localeCompare(a.date)).slice(0, 12);
  if(recent.length){
    h += '<h2>最近</h2>';
    recent.forEach(l => {
      const m = menuById(l.menuId);
      const d = parseDate(l.date);
      const title = l.mode === 'spot' ? (l.name || 'スポット作業') : (m ? m.name : 'メニュー');
      h += '<div class="row"><div><div class="name">' + ((d.getMonth()+1) + '/' + d.getDate() + ' ' +
        esc(title)) + '</div><div class="meta">' +
        (l.mode === 'rest' ? '休んだ' : l.mode === 'part' ? '途中まで'
          : l.mode === 'spot' ? 'スポット作業' : '完了') +
        (l.points ? ' ・ +' + l.points + 'pt' : '') +
        (l.durationSec ? ' ・ ' + Math.round(l.durationSec / 60) + '分' : '') + '</div></div>' +
        '<button class="iconbtn" data-act="dellog" data-id="' + l.id + '" style="margin-left:auto">✕</button></div>';
    });
  }
  return h + '</div>';
}

/* ========== 実行モード ========== */
function startRun(menuId){
  const m = menuById(menuId);
  if(!m || !m.items.length) return;
  const queue = [];
  m.items.forEach(it => {
    const e = exById(it.exerciseId);
    if(!e) return;
    queue.push({exerciseId:e.id, name:e.name, unit:e.unit, amount:it.amount,
                sets:Math.max(1, it.sets), minutes:e.minutes || 0,
                rest:it.rest || 0, setDone:0, done:false});
  });
  if(!queue.length) return;
  // 途中まででやめていたら、そこから続ける
  const before = logFor(todayStr(), menuId);
  let awarded = 0, idx = 0;
  if(before && before.mode === 'part'){
    awarded = before.points || 0;
    (before.entries || []).forEach(en => {
      if(!en.done) return;
      const q = queue.find(x => x.exerciseId === en.exerciseId && !x.done);
      if(q){ q.done = true; q.setDone = q.sets; }
    });
    while(idx < queue.length && queue[idx].done) idx++;
    if(idx >= queue.length) idx = 0;
  }
  run = {menuId, name:m.name, queue, idx, awarded, startedAt:Date.now(),
         elapsed:(before && before.mode === 'part' ? (before.durationSec || 0) : 0),
         running:true, resting:false, restLeft:0, timer:null, finished:false};
  document.body.classList.add('running');
  saveRun();
  render();
  run.timer = setInterval(tick, 1000);
}
/* ===== タイマー =====
   経過時間は「ためた秒数 ＋ いま動いている分」で出す。
   一時停止しても、アプリが落ちても、時間を取りこぼさないため。       */
const RUNKEY = 'myroutine.run';
let pendingRun = loadRun();     // 前回、計りかけで終わってしまったもの

function runElapsed(){
  if(!run) return 0;
  return (run.elapsed || 0) +
         (run.running && run.startedAt ? Math.floor((Date.now() - run.startedAt) / 1000) : 0);
}
function saveRun(){
  try {
    if(!run || run.finished){ localStorage.removeItem(RUNKEY); return; }
    const copy = Object.assign({}, run, {elapsed:runElapsed(), running:run.running,
                                         startedAt:null, timer:null, savedAt:Date.now()});
    localStorage.setItem(RUNKEY, JSON.stringify(copy));
  } catch(e){}
}
function loadRun(){
  try { const s = localStorage.getItem(RUNKEY); return s ? JSON.parse(s) : null; } catch(e){ return null; }
}
function pauseRun(){
  if(!run || !run.running) return;
  run.elapsed = runElapsed();
  run.running = false;
  run.startedAt = null;
  saveRun();
  render();
}
function resumeRun(){
  if(!run || run.running) return;
  run.startedAt = Date.now();
  run.running = true;
  saveRun();
  render();
}
/* 計りかけのものを、止まった状態で開きなおす */
function restoreRun(){
  if(!pendingRun) return;
  run = pendingRun;
  pendingRun = null;
  run.running = false;      // 落ちていた間の時間は数えない
  run.startedAt = null;
  run.timer = setInterval(tick, 1000);
  document.body.classList.add('running');
  render();
}
function dropRun(){
  pendingRun = null;
  try { localStorage.removeItem(RUNKEY); } catch(e){}
  render();
}

/* スポット作業は時間をはかる。押した日で記録される */
function startSpot(id){
  const s = spotById(id);
  if(!s || s.done) return;
  run = {kind:'spot', spotId:id, name:s.name, startedAt:Date.now(), elapsed:0, running:true,
         timer:null, finished:false};
  document.body.classList.add('running');
  saveRun();
  render();
  run.timer = setInterval(tick, 1000);
}

/* complete=true なら終わり、false なら途中まで（タスクは残る） */
function finishSpot(complete){
  const s = spotById(run.spotId);
  if(!s){ stopRun(); return; }
  if(run.timer) clearInterval(run.timer);
  run.timer = null;

  const mins = Math.max(0, Math.floor(runElapsed() / 60));
  const ds = todayStr();
  const first = !logsOn(ds).some(l => l.mode === 'full' || l.mode === 'part' || l.mode === 'spot');
  const sb = first ? streakBonusOf(Math.max(1, streak() + 1)) : 0;

  // ポイントは「たまった時間」から出す。5分に足りないぶんは次に持ちこす
  const already = s.earned || 0;
  const total   = (s.spent || 0) + mins;
  const base    = Math.max(0, ptFromMin(total) - already) + (complete ? COMPLETE_BONUS : 0);

  s.spent  = total;
  s.earned = already + base;
  if(complete){ s.done = true; s.doneDate = ds; }

  stamp(s);
  db.logs.push(stamp({id:'spot_' + s.id + '_' + Date.now(), date:ds, spotId:s.id, mode:'spot',
                points:base + sb, minutes:mins, cat:s.cat, name:s.name, partial:!complete}));

  run.finished = true;
  run.gain = {total:base + sb, base, streakBonus:sb, mins, complete, spent:s.spent,
              bonus:complete ? COMPLETE_BONUS : 0};
  save();
  autoSend();
  render();
}

function stopRun(){
  if(run && run.timer) clearInterval(run.timer);
  run = null;
  try { localStorage.removeItem(RUNKEY); } catch(e){}
  document.body.classList.remove('running');
  view = {name:'today'};
  render();
}
let tickCount = 0;
function tick(){
  if(!run || run.finished) return;
  if(!run.running) return;                 // 一時停止中は何も進めない
  if(++tickCount % 15 === 0) saveRun();    // 落ちても15秒ぶんしか失わないように
  if(run.kind === 'spot'){
    const el = document.getElementById('elapsed');
    if(el) el.textContent = mmss(runElapsed());
    return;
  }
  if(run.resting){
    run.restLeft--;
    if(run.restLeft <= 0){ run.resting = false; beep(); }
    render();
  } else {
    const el = document.getElementById('elapsed');
    if(el) el.textContent = mmss(runElapsed());
  }
}
function mmss(s){ return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
function beep(){
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .4);
    o.start(); o.stop(ctx.currentTime + .4);
  } catch(e){}
}
function doneSet(){
  const it = run.queue[run.idx];
  it.setDone++;
  if(it.setDone >= it.sets){
    it.done = true;
    if(run.queue.every(q => q.done)){ finishRun(true); return; }
    while(run.idx < run.queue.length - 1 && run.queue[run.idx + 1].done) run.idx++;
    if(run.idx >= run.queue.length - 1){ run.idx = run.queue.findIndex(q => !q.done); }
    else run.idx++;
    if(it.rest > 0){ run.resting = true; run.restLeft = it.rest; }
  } else if(it.rest > 0){
    run.resting = true; run.restLeft = it.rest;
  }
  render();
}
function skipItem(){
  const next = run.queue.findIndex((q,i) => i > run.idx && !q.done);
  if(next < 0){
    const back = run.queue.findIndex(q => !q.done);
    if(back < 0 || back === run.idx){ finishRun(run.queue.every(q => q.done)); return; }
    run.idx = back;
  } else run.idx = next;
  run.resting = false;
  render();
}
/* complete=true ならやりきり、false なら途中まで（メニューは今日の分として残る） */
function finishRun(complete){
  if(run.timer) clearInterval(run.timer);
  run.timer = null;
  run.finished = true;
  run.durationSec = runElapsed();
  const ds = todayStr();
  run.gain = runPoints(complete);    // 消す前に数える。あとだと連続ボーナスが二重になる
  const old = logFor(ds, run.menuId);
  if(old) db.logs = db.logs.filter(l => l !== old);
  db.logs.push(stamp({
    id: ds + '_' + run.menuId, date: ds, menuId: run.menuId,
    mode: complete ? 'full' : 'part',
    durationSec: run.durationSec, points: (run.awarded || 0) + run.gain.total,
    entries: run.queue.map(q => ({exerciseId:q.exerciseId, amount:q.amount * (q.setDone || 0),
                                 done:q.done, minutes:q.minutes * (q.setDone || 0)}))
  }));
  save();
  autoSend();
  render();
}

function viewRun(){
  if(run.kind === 'spot') return viewRunSpot();
  const q = run.queue, it = q[run.idx];
  if(run.finished){
    const n = q.filter(x => x.done).length, g = run.gain;
    let bd = '<div><span>' + minutesText(g.minutes) + '（種目 ' + g.doneCount + '/' + g.all + '）</span>' +
             '<b>+' + g.base + '</b></div>';
    if(g.bonus)       bd += '<div><span>ぜんぶ完了</span><b>+' + g.bonus + '</b></div>';
    if(g.streakBonus) bd += '<div><span>' + g.streakDays + '日れんぞく</span><b>+' + g.streakBonus + '</b></div>';
    return '<div id="run"><div class="rtop"></div>' +
      '<div class="rbody"><div class="nm">' +
      (g.complete ? 'おつかれさま 🎉' : 'ここまで記録しました') + '</div>' +
      '<div class="gain">+' + g.total + '<small>pt</small></div>' +
      '<div class="bd">' + bd + '</div>' +
      '<div class="set" style="margin-top:14px">' + mmss(run.durationSec) +
      (g.complete ? '' : ' ・ のこり ' + (g.all - g.doneCount) + '種目は今日のうちに') +
      ' ・ 残高 ' + balance() + 'pt</div>' +
      '</div><div class="rbtns"><button class="primary" data-act="closerun">とじる</button></div></div>';
  }
  if(run.resting){
    return '<div id="run"><div class="rtop"><button class="stop" data-act="abort">中断</button>' +
      '<span class="mid">つぎ：' + esc(q[run.idx].name) + '</span></div>' +
      '<div class="rbody"><div class="rest">休憩</div>' +
      '<div class="cd">' + run.restLeft + '</div></div>' +
      '<div class="rbtns"><button class="primary" data-act="skiprest">つぎへ</button>' +
      '<div class="side"><button data-act="rest10">＋10秒</button></div></div></div>';
  }
  const pct = Math.round((run.idx / q.length) * 100);
  const amt = it.unit === 'チェック' ? 'やる' : it.amount;
  const unit = it.unit === 'チェック' ? '' : '<small>' + it.unit + '</small>';
  return '<div id="run"><div class="rtop"><button class="stop" data-act="abort">中断</button>' +
    '<span class="mid">' + (run.idx + 1) + ' / ' + q.length + '</span>' +
    '<span id="elapsed">' + mmss(runElapsed()) + (run.running ? '' : ' ⏸') + '</span></div>' +
    '<div class="prog"><i style="width:' + pct + '%"></i></div>' +
    '<div class="rbody">' +
    (exById(it.exerciseId) ? cover(exById(it.exerciseId), 'xl') : '') +
    '<div class="nm">' + esc(it.name) + '</div>' +
    '<div class="amt">' + amt + unit + '</div>' +
    (it.sets > 1 ? '<div class="set">セット ' + (it.setDone + 1) + ' / ' + it.sets + '</div>' : '') +
    (exById(it.exerciseId) ? urlChip(exById(it.exerciseId), '参考ページを開く') : '') +
    '</div><div class="rbtns">' +
    (run.running ? '<button class="primary" data-act="doneset">できた</button>'
                 : '<button class="primary" data-act="resume">再開する</button>') +
    '<div class="side">' +
    (run.running ? '<button data-act="pause">一時停止</button>'
                 : '<button data-act="doneset">できた</button>') +
    '<button data-act="skipitem">とばす</button></div>' +
    '<button data-act="partrun" style="background:none;border:none;color:var(--muted);' +
    'font-size:14px;font-weight:600;padding:8px">途中までにして戻る</button>' +
    '</div></div>';
}

function viewRunSpot(){
  const s = spotById(run.spotId);
  if(!s) return '<div id="run"><div class="rbtns">' +
    '<button class="primary" data-act="closerun">とじる</button></div></div>';

  if(run.finished){
    const g = run.gain;
    let bd = '<div><span>' + g.mins + '分</span><b>+' + (g.base - (g.bonus || 0)) + '</b></div>';
    if(g.bonus)       bd += '<div><span>やりきった</span><b>+' + g.bonus + '</b></div>';
    if(g.streakBonus) bd += '<div><span>今日の1本目</span><b>+' + g.streakBonus + '</b></div>';
    return '<div id="run"><div class="rtop"></div><div class="rbody">' +
      '<div class="nm">' + (g.complete ? 'おつかれさま 🎉' : 'ここまで記録しました') + '</div>' +
      '<div class="gain">+' + g.total + '<small>pt</small></div>' +
      '<div class="bd">' + bd + '</div>' +
      '<div class="set" style="margin-top:14px">' +
      (g.complete ? '合計 ' + minutesText(g.spent) : 'ここまで ' + minutesText(g.spent) + '（つづきはまた今度）') +
      ' ・ 残高 ' + balance() + 'pt</div>' +
      '</div><div class="rbtns">' +
      '<button class="primary" data-act="closerun">とじる</button></div></div>';
  }

  const paused = !run.running;
  return '<div id="run"><div class="rtop">' +
    '<button class="stop" data-act="abort">やめる</button>' +
    '<span class="mid">' + catOf(s.cat).name +
    (s.spent ? ' ・ ここまで ' + minutesText(s.spent) : '') + '</span></div>' +
    '<div class="rbody">' + cover(s, 'xl') + '<div class="nm">' + esc(s.name) + '</div>' +
    '<div class="cd' + (paused ? ' paused' : '') + '" id="elapsed">' + mmss(runElapsed()) + '</div>' +
    '<div class="set">' + (paused ? '一時停止中' : '5分で1ポイント') + '</div>' +
    urlChip(s, '参考ページを開く') + '</div>' +
    '<div class="rbtns">' +
    (paused ? '<button class="primary" data-act="resume">再開する</button>'
            : '<button class="primary" data-act="spotdone">おわり</button>') +
    '<div class="side">' +
    (paused ? '<button data-act="spotdone">おわり</button>'
            : '<button data-act="pause">一時停止</button>') +
    '<button data-act="spotpart">途中まで</button></div></div></div>';
}

/* ========== 表紙画像 ==========
   画像は同期データに入れない（重くなって上限に当たるため）。
   データにはIDだけを持たせ、中身は端末の IndexedDB と、あずかり所の /img/<id> に置く。
   別の端末は、IDを見て足りない画像をあずかり所から取ってくる。            */
const IMGQ = 'myroutine.imgq';            // まだ送れていない画像のID
const imgUrls = new Map(), imgBusy = new Set(), imgMissing = new Set();
let idbP = null;
function idb(){
  return idbP || (idbP = new Promise((res, rej) => {
    const r = indexedDB.open('myroutine-img', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function idbDo(mode, fn){
  return idb().then(d => new Promise((res, rej) => {
    const t = d.transaction('img', mode), q = fn(t.objectStore('img'));
    t.oncomplete = () => res(q && q.result);
    t.onerror = () => rej(t.error);
  }));
}
const imgGet = id => idbDo('readonly', st => st.get(id));
const imgPut = (id, blob) => idbDo('readwrite', st => st.put(blob, id));
const imgBase = () => db.sync.url.replace(/\/+$/, '') + '/img/';

function paintImgs(){
  document.querySelectorAll('[data-img]').forEach(el => {
    const u = imgUrls.get(el.dataset.img);
    if(u){ el.style.backgroundImage = 'url(' + u + ')'; el.classList.add('has'); }
    else loadImg(el.dataset.img);
  });
}
function loadImg(id){
  if(imgUrls.has(id) || imgBusy.has(id) || imgMissing.has(id)) return;
  imgBusy.add(id);
  imgGet(id)
    .then(b => b || (syncReady()
      ? fetch(imgBase() + id, {headers:authHead()})
          .then(r => r.ok ? r.blob() : null)
          .then(b2 => { if(b2) imgPut(id, b2).catch(() => {}); return b2; })
      : null))
    .then(b => {
      imgBusy.delete(id);
      if(!b){ imgMissing.add(id); return; }
      imgUrls.set(id, URL.createObjectURL(b));
      paintImgs();
    })
    .catch(() => { imgBusy.delete(id); imgMissing.add(id); });
}
/* 長い辺を800pxまでに縮める。WebP が作れなければ JPEG */
function shrinkImage(file){
  return createImageBitmap(file).then(bm => {
    const r = Math.min(1, 800 / Math.max(bm.width, bm.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bm.width * r);
    c.height = Math.round(bm.height * r);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    return new Promise(res => c.toBlob(res, 'image/webp', .82))
      .then(b => b && b.type === 'image/webp' ? b : new Promise(res => c.toBlob(res, 'image/jpeg', .85)));
  });
}
function takeImage(file, target){
  target = target || view.draft;
  if(!file || !target) return Promise.resolve();
  return shrinkImage(file)
    .then(blob => {
      const id = 'im-' + (crypto.randomUUID ? crypto.randomUUID() : uid() + uid() + uid());
      return imgPut(id, blob).then(() => {
        imgUrls.set(id, URL.createObjectURL(blob));
        if(view.draft === target){ target.img = id; render(); }
      });
    })
    .catch(() => alert('この画像は読めませんでした。'));
}
/* 参考URLのページから表紙を取る（あずかり所が代わりに読みに行く）。
   auto=true はURLを入れたときの自動。画像がもうあるときは呼ばない     */
function coverFromUrl(auto){
  const d = view.draft, u = d && safeUrl(d.url);
  if(!u) return;
  if(!syncReady()){
    if(!auto) alert('表紙を取るには、記録タブの同期で「Googleで入る」を済ませてください。');
    return;
  }
  view.coverBusy = true; view.coverMsg = '';
  render();
  fetch(db.sync.url.replace(/\/+$/, '') + '/og', {method:'POST',
      headers:Object.assign({'content-type':'application/json'}, authHead()),
      body:JSON.stringify({url:u})})
    .then(r => { if(!r.ok) throw r.status; return r.blob(); })
    .then(b => { if(view.draft !== d) return; view.coverBusy = false; return takeImage(b, d); })
    .catch(() => {
      if(view.draft !== d) return;
      view.coverBusy = false;
      view.coverMsg = 'このページからは表紙が取れませんでした。画像をえらぶか、貼りつけてください。';
      render();
    });
}
/* 保存するとき：新しい画像は送り、使わなくなった画像は片づける */
function settleImg(old, d){
  const before = old && old.img;
  if(d.img && d.img !== before) queueImg(d.img);
  if(before && before !== d.img) dropImg(before);
}
const imgQueue = () => { try { return JSON.parse(localStorage.getItem(IMGQ) || '[]'); } catch(e){ return []; } };
const setImgQueue = q => { try { localStorage.setItem(IMGQ, JSON.stringify(q)); } catch(e){} };
function queueImg(id){
  const q = imgQueue();
  if(!q.includes(id)) q.push(id);
  setImgQueue(q);
  setTimeout(flushImgs, 0);
}
let flushing = false;
function flushImgs(){
  if(flushing || !syncReady()) return;
  const id = imgQueue()[0];
  if(!id) return;
  flushing = true;
  imgGet(id)
    .then(b => b && fetch(imgBase() + id, {method:'PUT',
        headers:Object.assign({'content-type':b.type || 'image/jpeg'}, authHead()), body:b})
      .then(r => { if(!r.ok) throw r.status; }))
    .then(() => { setImgQueue(imgQueue().filter(x => x !== id)); flushing = false; flushImgs(); })
    .catch(() => { flushing = false; });       // つながらなければ、次の同期のときにまた送る
}
function dropImg(id){
  if(!id) return;
  setImgQueue(imgQueue().filter(x => x !== id));
  idbDo('readwrite', st => st.delete(id)).catch(() => {});
  const u = imgUrls.get(id);
  if(u){ URL.revokeObjectURL(u); imgUrls.delete(id); }
  if(syncReady()) fetch(imgBase() + id, {method:'DELETE', headers:authHead()}).catch(() => {});
}
function normUrl(u){
  u = String(u || '').trim();
  if(u && !/^https?:\/\//i.test(u) && /\./.test(u)) u = 'https://' + u;
  return u;
}

/* ========== 描画 ========== */
function render(){
  const app = document.getElementById('app');
  let h = '';
  if(run) h = viewRun();
  else if(view.name === 'today') h = viewToday();
  else if(view.name === 'menus') h = viewMenus();
  else if(view.name === 'menuEdit') h = viewMenuEdit();
  else if(view.name === 'exercises') h = viewExercises();
  else if(view.name === 'exEdit') h = viewExEdit();
  else if(view.name === 'spotEdit') h = viewSpotEdit();
  else if(view.name === 'rewards') h = viewRewards();
  else if(view.name === 'rewardEdit') h = viewRewardEdit();
  else if(view.name === 'records') h = viewRecords();
  app.innerHTML = h;
  paintImgs();
  const tabName = view.name === 'menuEdit' ? 'menus' :
                  view.name === 'exEdit' ? 'exercises' :
                  view.name === 'rewardEdit' ? 'rewards' :
                  view.name === 'spotEdit' ? 'today' : view.name;
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === tabName);
  });
}
function go(name){ view = {name}; render(); }

/* ========== 操作 ========== */
document.getElementById('tabs').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if(b) go(b.dataset.tab);
});

document.getElementById('app').addEventListener('click', ev => {
  if(ev.target.closest('a[href]')) return;     // 参考URLのリンクは、そのまま開く
  const b = ev.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.id;

  if(act === 'tab') return go(b.dataset.tab);

  // 今日
  if(act === 'start')      return startRun(id);
  if(act === 'rest'){
    const ds = todayStr();
    db.logs = db.logs.filter(l => !(l.date === ds && l.menuId === id));
    db.logs.push(stamp({id:ds + '_' + id, date:ds, menuId:id, mode:'rest'}));
    save(); return render();
  }
  if(act === 'undo'){
    const ds = todayStr();
    const log = logFor(ds, id);
    if(log && balance() - (log.points || 0) < 0){
      alert('取り消すと、交換ずみのごほうびのぶんだけポイントが足りなくなります。\n先に「ごほうび」の交換履歴を消してください。');
      return;
    }
    db.logs.filter(l => l.date === ds && l.menuId === id).forEach(l => bury(l.id));
    db.logs = db.logs.filter(l => !(l.date === ds && l.menuId === id));
    save(); return render();
  }
  if(act === 'install'){
    if(!installEvt) return;
    const e = installEvt;
    installEvt = null;
    e.prompt();
    e.userChoice.then(() => render());
    return;
  }
  if(act === 'noinstall'){ installEvt = null; return render(); }
  if(act === 'dellog'){
    bury(id);
    db.logs = db.logs.filter(l => l.id !== id);
    save(); return render();
  }

  // 実行モード
  if(act === 'doneset')  return doneSet();
  if(act === 'skipitem') return skipItem();
  if(act === 'skiprest'){ run.resting = false; return render(); }
  if(act === 'rest10'){ run.restLeft += 10; return render(); }
  if(act === 'abort'){
    const msg = run && run.kind === 'spot'
      ? 'やめます。いま計った時間は記録しません。記録したいなら「途中まで」を押してください。'
      : '中断します。ここまでの分は記録しません。';
    if(confirm(msg)) stopRun();
    return;
  }
  if(act === 'closerun') return stopRun();
  if(act === 'startspot') return startSpot(id);
  if(act === 'pause')  return pauseRun();
  if(act === 'resume') return resumeRun();
  if(act === 'resumerun'){ restoreRun(); return resumeRun(); }
  if(act === 'droprun'){
    if(!confirm('計った時間を捨てます。よろしいですか？')) return;
    return dropRun();
  }
  if(act === 'bankrun'){
    restoreRun();
    if(run && run.kind === 'spot') finishSpot(false);
    return;
  }
  if(act === 'spotdone') return finishSpot(true);
  if(act === 'spotpart') return finishSpot(false);
  if(act === 'partrun'){
    if(!run.queue.some(q => q.done)){
      alert('まだ1つも終わっていません。「やめる」で戻ってください。');
      return;
    }
    return finishRun(false);
  }

  // メニュー編集
  if(act === 'newmenu'){
    view = {name:'menuEdit', isNew:true,
            draft:{id:uid(), name:'', days:[1,2,3,4,5], time:'07:00', items:[]}};
    return render();
  }
  if(act === 'editmenu'){
    view = {name:'menuEdit', isNew:false, draft:JSON.parse(JSON.stringify(menuById(id)))};
    return render();
  }
  if(act === 'day'){
    const i = Number(b.dataset.i), d = view.draft.days;
    const at = d.indexOf(i);
    if(at >= 0) d.splice(at, 1); else d.push(i);
    return render();
  }
  if(act === 'itemdel'){ view.draft.items.splice(Number(b.dataset.i), 1); return render(); }
  if(act === 'itemup'){
    const i = Number(b.dataset.i);
    if(i > 0){ const a = view.draft.items; [a[i-1], a[i]] = [a[i], a[i-1]]; }
    return render();
  }
  if(act === 'savemenu'){
    const d = view.draft;
    if(!d.name.trim()){ alert('名前を入れてください'); return; }
    if(!d.days.length){ alert('曜日を1つ以上えらんでください'); return; }
    stamp(d);
    const old = menuById(d.id);
    if(old) db.menus[db.menus.indexOf(old)] = d; else db.menus.push(d);
    save(); return go('menus');
  }
  if(act === 'delmenu'){
    if(!confirm('このメニューを削除します。記録は残ります。')) return;
    bury(view.draft.id);
    db.menus = db.menus.filter(m => m.id !== view.draft.id);
    save(); return go('menus');
  }

  if(act === 'import'){ document.getElementById('importfile').click(); return; }
  if(act === 'glogin')   return googleLogin();
  if(act === 'glogout')  return googleLogout();
  if(act === 'syncnow')  return syncPull(true);
  if(act === 'sendnow')  return syncPush(true);

  // 書き出し
  if(act === 'export' || act === 'exportfile'){
    const json = JSON.stringify(summary(), null, 1);
    if(act === 'exportfile'){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
      a.download = 'records.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      return;
    }
    const box = document.getElementById('exportbox');
    const ta = document.getElementById('exporttext');
    box.style.display = 'block';
    ta.value = json;
    if(navigator.clipboard){
      navigator.clipboard.writeText(json)
        .then(() => alert('コピーしました。貼りつければサイトに反映できます。'))
        .catch(() => ta.select());
    } else { ta.select(); }
    return;
  }

  // スポット作業
  if(act === 'newspot'){
    view = {name:'spotEdit', isNew:true,
            draft:{id:uid(), name:'', cat:'other', minutes:0, date:'', done:false}};
    return render();
  }
  if(act === 'editspot'){
    view = {name:'spotEdit', isNew:false, draft:Object.assign({}, spotById(id))};
    return render();
  }
  if(act === 'savespot'){
    const d = view.draft;
    if(!d.name.trim()){ alert('やることを書いてください'); return; }
    d.minutes = Math.max(0, Number(d.minutes) || 0);
    if(!d.date) d.date = '';
    d.url = normUrl(d.url);
    settleImg(spotById(d.id), d);
    stamp(d);
    const old = spotById(d.id);
    if(old) db.spots[db.spots.indexOf(old)] = d; else db.spots.push(d);
    save(); return go('today');
  }
  if(act === 'delspot'){
    if(!confirm('このスポット作業を消しますか？')) return;
    bury(view.draft.id);
    dropImg((spotById(view.draft.id) || {}).img);
    if(view.draft.img) dropImg(view.draft.img);
    db.spots = db.spots.filter(s => s.id !== view.draft.id);
    save(); return go('today');
  }
  if(act === 'dospot'){
    // 時間をはからずに終わりにする。目安の時間でポイントを出す
    const s = spotById(id);
    if(!s || s.done) return;
    if(!confirm('時間をはからずに終わりにします。目安の時間（' +
                (minutesText(s.minutes) || '0分') + '）でポイントが入ります。')) return;
    const ds = todayStr();
    const first = !logsOn(ds).some(l => l.mode === 'full' || l.mode === 'part' || l.mode === 'spot');
    const sb = first ? streakBonusOf(Math.max(1, streak() + 1)) : 0;
    const total = (s.spent || 0) + (s.minutes || 0);
    const base = Math.max(0, ptFromMin(total) - (s.earned || 0)) + COMPLETE_BONUS;
    s.spent = total; s.earned = (s.earned || 0) + base;
    s.done = true; s.doneDate = ds;
    stamp(s);
    db.logs.push(stamp({id:'spot_' + s.id + '_' + Date.now(), date:ds, spotId:s.id, mode:'spot',
                  points:base + sb, minutes:s.minutes || 0, cat:s.cat, name:s.name}));
    save(); autoSend(); go('today');
    setTimeout(() => alert('+' + (base + sb) + 'pt'), 30);
    return;
  }
  if(act === 'undospot'){
    const s = spotById(id);
    if(!s) return;
    const pts = db.logs.filter(l => l.spotId === s.id).reduce((a,l) => a + (l.points || 0), 0);
    if(balance() - pts < 0){
      alert('取り消すと、交換ずみのごほうびのぶんだけポイントが足りなくなります。\n先に「ごほうび」の交換履歴を消してください。');
      return;
    }
    s.done = false; delete s.doneDate; s.spent = 0; s.earned = 0; stamp(s);
    db.logs.filter(l => l.spotId === s.id).forEach(l => bury(l.id));
    db.logs = db.logs.filter(l => l.spotId !== s.id);
    save(); return render();
  }
  if(act === 'cat'){ view.draft.cat = b.dataset.c; return render(); }
  if(act === 'kind'){
    view.draft.kind = view.draft.kind === b.dataset.k ? '' : b.dataset.k;   // もう一度押すと外れる
    return render();
  }
  if(act === 'addkind'){
    const name = (prompt('種類の名前（例：動画、資格、ポッドキャスト）') || '').trim();
    if(!name) return;
    let k = (db.kinds || []).find(x => x.name === name);
    if(!k){
      k = stamp({id:'k-' + uid(), name, icon:'🏷️'});
      db.kinds.push(k);
      save();
    }
    view.draft.kind = k.id;
    return render();
  }
  if(act === 'delkind'){
    const k = kindOf(b.dataset.k);
    if(!k) return;
    if(!confirm('「' + k.name + '」を選択肢から消します。この種類が付いているタスクは、種類なしになります。')) return;
    bury(k.id);
    db.kinds = db.kinds.filter(x => x.id !== k.id);
    [...db.spots, ...db.exercises].forEach(r => { if(r.kind === k.id){ r.kind = ''; stamp(r); } });
    if(view.draft.kind === k.id) view.draft.kind = '';
    save(); return render();
  }
  if(act === 'pickimg'){ document.getElementById('imgfile').click(); return; }
  if(act === 'removeimg'){ view.draft.img = ''; view.coverMsg = ''; return render(); }
  if(act === 'coverurl') return coverFromUrl(false);
  if(act === 'cleardate'){ view.draft.date = ''; return render(); }

  // ごほうび
  if(act === 'newreward'){
    view = {name:'rewardEdit', isNew:true, draft:{id:uid(), name:'', cost:100}};
    return render();
  }
  if(act === 'editreward'){
    view = {name:'rewardEdit', isNew:false, draft:Object.assign({}, db.rewards.find(r => r.id === id))};
    return render();
  }
  if(act === 'savereward'){
    const d = view.draft;
    if(!d.name.trim()){ alert('ごほうびを書いてください'); return; }
    d.cost = Math.max(1, Number(d.cost) || 1);
    stamp(d);
    const old = db.rewards.find(r => r.id === d.id);
    if(old) db.rewards[db.rewards.indexOf(old)] = d; else db.rewards.push(d);
    save(); return go('rewards');
  }
  if(act === 'delreward'){
    if(!confirm('このごほうびを消しますか？')) return;
    bury(view.draft.id);
    db.rewards = db.rewards.filter(r => r.id !== view.draft.id);
    save(); return go('rewards');
  }
  if(act === 'redeem'){
    const r = db.rewards.find(x => x.id === id);
    if(!r || balance() < r.cost) return;
    if(!confirm(r.name + '\n' + r.cost + 'pt つかいます。交換しますか？')) return;
    db.redemptions.push(stamp({id:uid(), date:todayStr(), rewardId:r.id, name:r.name, cost:r.cost}));
    save(); render();
    alert('交換しました。たっぷり楽しんでください。');
    return;
  }
  if(act === 'delredeem'){
    if(!confirm('この交換を取り消して、ポイントを戻しますか？')) return;
    bury(id);
    db.redemptions = db.redemptions.filter(r => r.id !== id);
    save(); return render();
  }

  // 種目編集
  if(act === 'newex'){
    view = {name:'exEdit', isNew:true,
            draft:{id:uid(), name:'', unit:'回', amount:10, cat:'other', minutes:5}};
    return render();
  }
  if(act === 'editex'){
    view = {name:'exEdit', isNew:false, draft:Object.assign({}, exById(id))};
    return render();
  }
  if(act === 'saveex'){
    const d = view.draft;
    if(!d.name.trim()){ alert('名前を入れてください'); return; }
    d.amount  = Number(d.amount) || 0;
    d.minutes = Math.max(0, Number(d.minutes) || 0);
    d.url = normUrl(d.url);
    settleImg(exById(d.id), d);
    stamp(d);
    const old = exById(d.id);
    if(old) db.exercises[db.exercises.indexOf(old)] = d; else db.exercises.push(d);
    save(); return go('exercises');
  }
  if(act === 'delex'){
    const used = db.menus.filter(m => m.items.some(it => it.exerciseId === view.draft.id));
    if(!confirm(used.length ? used.length + 'つのメニューから外れます。削除しますか？' : '削除しますか？')) return;
    bury(view.draft.id);
    dropImg((exById(view.draft.id) || {}).img);
    if(view.draft.img) dropImg(view.draft.img);
    db.exercises = db.exercises.filter(e => e.id !== view.draft.id);
    db.menus.forEach(m => { m.items = m.items.filter(it => it.exerciseId !== view.draft.id); });
    save(); return go('exercises');
  }
});

// 入力は再描画せずに draft へ流し込む（打っている途中で消えないように）

  const t = ev.target;
  if(t.dataset.sync && t.type !== 'checkbox'){
    db.sync[t.dataset.sync] = t.value.trim();

});

document.getElementById('imgfile').addEventListener('change', ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  takeImage(f);
});
// パソコンでは Ctrl+V で画像を貼りつけられる（編集画面のときだけ）
document.addEventListener('paste', ev => {
  if(!view.draft || (view.name !== 'spotEdit' && view.name !== 'exEdit')) return;
  const it = [...((ev.clipboardData && ev.clipboardData.items) || [])].find(x => x.type.startsWith('image/'));
  if(!it) return;
  ev.preventDefault();
  takeImage(it.getAsFile());
});

document.getElementById('gsicancel').addEventListener('click', () => {
  document.getElementById('gsi').style.display = 'none';
});

document.getElementById('importfile').addEventListener('change', ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';                 // 同じファイルを選び直せるように
  if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    let d;
    try { d = JSON.parse(fr.result); } catch(e){ alert('このファイルは読めませんでした。'); return; }
    if(!d || !Array.isArray(d.logs)){ alert('マイメニューの控えではないようです。'); return; }
    if(!confirm('この端末の記録を、ファイルの中身で置きかえます。いまの記録は消えます。'
                + '（記録 ' + d.logs.length + '件）')) return;
    try { localStorage.setItem(KEY + '.backup', JSON.stringify(db)); } catch(e){}
    const keep = db.sync;
    db = migrate(d);
    db.sync = keep;
    save();                              // 送り出す側になる
    view = {name:'today'};
    render();
    alert('戻しました。');
  };
  fr.readAsText(f);
});

render();

// 開いたときに、あずかり所の方が新しければ取り込む
if(syncReady()) setTimeout(() => syncPull(false), 300);

// Chrome がインストールできると判断したら、今日の画面にボタンを出す
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault();
  installEvt = ev;
  if(!run) render();
});
window.addEventListener('appinstalled', () => { installEvt = null; if(!run) render(); });

// ホーム画面に入れて、オフラインでも開けるようにする
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
